name: Feature request
description: Something kube-city should do.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or annoying today?
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: For whom
      description: Who benefits (e.g. people with big clusters, people sharing screenshots)?
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How do we know it is finished? One line per check.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Ideas, examples, screenshots.
