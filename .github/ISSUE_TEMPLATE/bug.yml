name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Commands and clicks; `kube-city --demo` if it happens there too.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `kube-city --version`, or the version in the page header.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
